<html>
<title>responsive</title>
<style>
    .flex-container{
        background-color: yellow;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        flex-wrap: wrap;
        gap: 10px;
    }
    .flex-item{
        background-color: red;
        width: 200px;
        height: 200px;
    }
</style>
</html>
<body>
    <div class="flex-container">
        <div class="flex-item"></div>
        <div class="flex-item"></div>
        <div class="flex-item"></div>
    </div>
</body>
